<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  :root {  /* Minimal Dark — the app's factory theme, verbatim: true black,
              paper ink #e0e0de, 14% hairlines, cool-white LED accents */
    --bg:#000; --ink:#e0e0de; --dim:#8a8a86; --line:rgba(255,255,255,.14);
    --accent:#f6f9ff; --code-bg:#101010;
  }
  :root[data-theme="light"] {  /* Minimal — flat warm paper, near-black ink */
    --bg:#f2efe6; --ink:#242426; --dim:#6f6a60; --line:rgba(0,0,0,.16);
    --accent:#242426; --code-bg:#e8e4d8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.7 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:48px 22px 80px; }
  h1, h2, h3 { line-height:1.25; }
  h1 { font-size:30px; letter-spacing:.02em; }
  h2 { margin-top:2.2em; border-bottom:1px solid var(--line); padding-bottom:.3em; }
  a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--line);
      text-underline-offset:3px; }
  a:hover { color:var(--accent); text-decoration-color:var(--accent); }
  /* landing */
  .hero { text-align:center; padding:30px 0 10px; }
  .hero h1 { font-size:44px; letter-spacing:.45em; font-weight:500; margin:0 0 6px;
             padding-left:.45em; /* recenters the letterspaced last gap */ }
  .hero .sub { color:var(--dim); font-size:17px; margin:0 0 26px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
          gap:1px; background:var(--line); border:1px solid var(--line); margin:28px 0; }
  .grid > div { background:var(--bg); padding:16px 18px; }
  .grid b { display:block; margin-bottom:4px; letter-spacing:.06em; }
  .grid span { color:var(--dim); font-size:14px; line-height:1.55; }
  .led { color:var(--accent); }
  code { background:var(--code-bg); padding:2px 5px; border-radius:3px; font-size:.9em; }
  table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:7px 10px; text-align:left; font-size:15px; }
  img { max-width:100%; border:1px solid var(--line); border-radius:4px; }
  blockquote { border-left:3px solid var(--accent); margin-left:0; padding-left:16px; color:var(--dim); }
  hr { border:none; border-top:1px solid var(--line); margin:2.5em 0; }
  #mode { position:fixed; top:14px; right:16px; background:none; border:1px solid var(--line);
          color:var(--ink); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:15px; }
  #mode:hover { border-color:var(--accent); }
</style></head><body>
<button id="mode" title="Light / dark">☀︎</button>
<div class="wrap">{{ content }}</div>
<script>
  const root = document.documentElement, btn = document.getElementById("mode");
  const apply = t => { if (t === "light") root.setAttribute("data-theme","light");
                       else root.removeAttribute("data-theme");
                       btn.textContent = t === "light" ? "☾" : "☀︎"; };
  apply(localStorage.getItem("aramTheme") || "dark");   // dark is the factory default
  btn.onclick = () => { const next = root.hasAttribute("data-theme") ? "dark" : "light";
                        localStorage.setItem("aramTheme", next); apply(next); };
</script>
</body></html>
