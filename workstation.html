<title>ARAM · W</title>
<style>
  :root { --ink:#e8e6e0; --dim:#8a877f; --line:rgba(255,255,255,.14); --accent:#f6f9ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:var(--ink); font:16px/1.65 ui-monospace, "SF Mono", Menlo, monospace;
         min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:8vh 20px 60px; }
  .card { max-width:680px; width:100%; }
  h1 { font-size:22px; letter-spacing:.35em; font-weight:500; border-bottom:1px solid var(--line); padding-bottom:14px; }
  h1 .ws { color:var(--accent); }
  h2 { font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--dim); margin:34px 0 10px;
       border-bottom:1px solid var(--line); padding-bottom:6px; }
  p, ul, table { margin:14px 0; font-size:15px; }
  .tagline { color:var(--dim); }
  a { color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(246,249,255,.35); }
  ul { padding-left:20px; } li { margin:6px 0; }
  table { border-collapse:collapse; width:100%; }
  td { border-top:1px solid var(--line); padding:9px 12px 9px 0; vertical-align:top; font-size:15px; }
  td:first-child { white-space:nowrap; color:var(--accent); padding-right:18px; }
  code { color:var(--accent); font-size:13px; }
  .fine { color:var(--dim); font-size:13px; border-top:1px solid var(--line); padding-top:14px; margin-top:30px; }
  /* gate */
  #gate { text-align:center; padding-top:16vh; }
  #gate h1 { display:inline-block; border:none; }
  #gate p { color:var(--dim); font-size:13px; letter-spacing:.2em; }
  #pw { background:#000; border:1px solid var(--line); color:var(--ink); font:inherit; letter-spacing:.5em;
        text-align:center; padding:12px 16px; width:220px; margin-top:18px; outline:none; border-radius:2px; }
  #pw:focus { border-color:var(--accent); }
  #msg { height:20px; margin-top:10px; color:#d06060; font-size:12px; letter-spacing:.15em; }
  #content { display:none; }
</style></head><body>

  <div id="gate">

    <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus>

  <div id="content"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(pass) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(BLOB.s), iterations:600000, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(BLOB.n) }, key, b64(BLOB.c));
  return new TextDecoder().decode(pt);
}
const pw = document.getElementById("pw"), msg = document.getElementById("msg");
pw.addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  msg.textContent = "…";
  try {
    const html = await tryUnlock(pw.value);
    document.getElementById("gate").style.display = "none";
    const c = document.getElementById("content");
    c.innerHTML = html; c.style.display = "block";
    sessionStorage.setItem("aramw", pw.value);
  } catch { msg.textContent = "NO"; pw.value = ""; }
});
const saved = sessionStorage.getItem("aramw");
if (saved) { pw.value = saved; pw.dispatchEvent(new KeyboardEvent("keydown", {key:"Enter"})); }
